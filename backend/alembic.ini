# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = migrations

# prepend workspace path so alembic can find application code
prepend_sys_path = .

# version location specification; this defaults to migrations/versions.
# version_locations = %(here)s/migrations/versions

# version_path_separator = :

# logging configuration; this is configured below.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
